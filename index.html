<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фактури</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2446a8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Фактури">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Unbounded:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f3f5f4; --paper:#fff; --ink:#18221f; --muted:#5d6b66; --line:#dde3e0; --line-strong:#c4cdc9;
  --accent:#2446a8; --accent-soft:#e6ebf8; --on-accent:#fff;
  --paid:#1d7a4f; --paid-soft:#e2f2e9; --unpaid:#a86412; --unpaid-soft:#fbf0de; --late:#b3261e; --late-soft:#fbe5e3;
  --f-display:"Unbounded","Onest",system-ui,sans-serif; --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111715; --paper:#18201d; --ink:#e7ece9; --muted:#95a39e; --line:#28332f; --line-strong:#3a4742;
  --accent:#8ea8ff; --accent-soft:#1f2842; --on-accent:#111715;
  --paid:#5fcf95; --paid-soft:#15291f; --unpaid:#f0b35e; --unpaid-soft:#2d2314; --late:#ff8a80; --late-soft:#351a18; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,5vw,30px);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
.pill{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-strong);border-radius:999px;padding:3px 10px;white-space:nowrap}
.btn{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--late)}
.btn.danger-solid{background:var(--late);border-color:var(--late);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sum{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0;border:0;text-align:left}
.sum .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;align-items:center;gap:8px}
.sum .lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.sum .val{font-family:var(--f-num);font-size:clamp(17px,3vw,22px);font-weight:600;overflow-wrap:anywhere}
.sum .cnt{font-size:13px;color:var(--muted)}
button.sum .val{color:var(--accent)}
@media (max-width:860px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:16px;margin:0;font-weight:600}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:500}
.seg button[aria-pressed="true"].p{background:var(--paid-soft);color:var(--paid)}
.seg button[aria-pressed="true"].u{background:var(--unpaid-soft);color:var(--unpaid)}
.grid3{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line-strong);border-radius:7px;padding:10px;background:var(--bg);min-width:0;width:100%}
.fld input.r{text-align:right;font-family:var(--f-num)}
.fld input.auto{color:var(--muted)}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:1;background:transparent;border-color:var(--line);color:var(--ink)}
.bigpick{position:relative;border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.bigpick strong{font-size:16px}
.bigpick small{color:var(--muted)}
.bigpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.progress{display:flex;flex-direction:column;gap:4px;font-size:14px}
.progress span{display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite alternate;flex:none}
.ok{color:var(--paid)} .err{color:var(--late)}
@keyframes pulse{from{opacity:.25}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@media (max-width:520px){.grid3{grid-template-columns:1fr}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-strong);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;font-family:var(--f-num);margin-left:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.chip{border:0;background:transparent;padding:6px 11px;border-radius:6px;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar select,.toolbar input{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px;min-width:0}
.toolbar input{flex:1 1 180px}

.ledger{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:140px minmax(0,1.6fr) minmax(0,1fr) 96px 130px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.who{min-width:0;display:flex;flex-direction:column}
.who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{font-family:var(--f-num);font-size:14px}
.date.late{color:var(--late);font-weight:600}
.amt{font-family:var(--f-num);font-weight:600;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:500;font-size:12px;font-family:var(--f-body)}
.stamp{border:1.5px solid currentColor;border-radius:5px;padding:3px 8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;background:transparent}
.stamp.paid{color:var(--paid);background:var(--paid-soft)}
.stamp.unpaid{color:var(--unpaid);background:var(--unpaid-soft)}
.stamp.late{color:var(--late);background:var(--late-soft)}
.stamp.pend{color:var(--accent);background:var(--accent-soft)}
.stamp.part,.seg button[aria-pressed="true"].x{color:var(--accent);background:var(--accent-soft)}
.seg button[aria-pressed="true"].m{background:var(--accent-soft);color:var(--accent)}
.mtag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-right:4px}
button.sum{cursor:pointer}
.perbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.perbar label{font-weight:600}
.summary.kasa{grid-template-columns:repeat(2,minmax(0,1fr))}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kgrid{grid-template-columns:1fr}}
.kbox{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px 16px;min-width:0}
.kbox h3{margin:0 0 4px;font-size:15px}
.kbal{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;margin:8px 0;font-size:13px}
.kstats b{font-variant-numeric:tabular-nums}
.kform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0;padding:10px;border:1px dashed var(--line-strong);border-radius:8px}
.kform .full{grid-column:1/-1}
.krow{display:grid;grid-template-columns:78px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.krow .a{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.krow .plus{color:var(--paid)} .krow .minus{color:var(--unpaid)}
.krow button{border:0;background:transparent;color:var(--muted);padding:2px 6px}
.cat{display:inline-block;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:500;margin-right:6px}
.tp{color:var(--paid)} .tu{color:var(--unpaid)} .ta{color:var(--accent)}
.empty{padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-size:16px}
.foot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line-strong);background:var(--bg);font-size:14px}
@media (max-width:760px){
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who amt" "st dt";row-gap:6px}
  .c-who{grid-area:who}.c-amt{grid-area:amt}.c-st{grid-area:st}.c-dt{grid-area:dt;justify-self:end}.c-x{display:none}
}
.bar{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 120px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.bar .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .nm small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.track{height:12px;border-radius:3px;background:var(--bg);overflow:hidden;display:flex}
.track .fp{background:var(--paid)} .track .fu{background:var(--unpaid)}
.bar .v{font-family:var(--f-num);font-weight:600;text-align:right}
@media (max-width:560px){.bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm v" "tr tr"}.bar .nm{grid-area:nm}.bar .track{grid-area:tr}.bar .v{grid-area:v}}
.owe{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.owe:first-child{border-top:0}
.owe .v{font-family:var(--f-num);font-weight:600;font-size:18px;text-align:right}
.owe small{color:var(--muted);font-size:13px;display:block}

.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);display:flex;justify-content:flex-end;z-index:20}
.drawer{background:var(--paper);width:min(540px,100%);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.drawer h3{font-family:var(--f-display);font-size:17px;margin:0;font-weight:600;overflow-wrap:anywhere}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:transparent;font-size:24px;line-height:1;padding:4px 8px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
.vatrow{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg)}
.vatrow label{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.vatrow input[type=checkbox]{width:18px;height:18px}
.vatrow select{border:1px solid var(--line-strong);border-radius:7px;padding:6px 8px;background:var(--paper)}
.preview{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:440px;background:var(--bg)}
.preview img,.preview canvas{display:block;width:100%;height:auto}
.preview canvas{border-bottom:1px solid var(--line)}
.preview .ld{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.status{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:2px}
.status.pend{background:var(--accent-soft);color:var(--accent)} .status.ok{background:var(--paid-soft);color:var(--paid)} .status.rej{background:var(--late-soft);color:var(--late)}
.rejectbox{display:flex;flex-direction:column;gap:8px;border:1px solid var(--late);border-radius:8px;padding:12px}
.rejectbox textarea{border:1px solid var(--line-strong);border-radius:7px;padding:9px;background:var(--bg);width:100%}
.dfoot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.hint{font-size:13px;color:var(--muted)}
.bdrawer{width:min(760px,100%)}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.bstats>div{background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.bstats span{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.bstats b{font-family:var(--f-num);font-size:18px}
.bstats small{color:var(--muted);font-size:13px}
.blist{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.brow{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-top:1px solid var(--line);min-width:0}
.brow:first-child{border-top:0}
.bmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bmeta b{margin-left:auto}
.bmeta select,.bsel{border:1px solid var(--line-strong);border-radius:7px;padding:8px;background:var(--bg);min-width:0;max-width:100%;color:var(--ink)}
.bsel{width:100%}
.bdir{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px}
.bdir.in{color:var(--paid);background:var(--paid-soft)} .bdir.out{color:var(--unpaid);background:var(--unpaid-soft)}
.bdet{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.bdet b{color:var(--ink);font-weight:600}
.bto{font-size:14px;color:var(--muted)} .bto.ok{color:var(--paid);font-weight:500}
.mono{font-family:var(--f-num)} .minus{color:var(--unpaid)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.notice{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:16px;color:var(--muted)}
.bigpick.compact{padding:12px}
.bigpick.compact small{display:none}
.tray{display:flex;flex-direction:column;gap:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:72px;height:96px;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--bg);display:grid;place-items:center;font-size:12px;color:var(--muted);font-family:var(--f-num)}
.th img{width:100%;height:100%;object-fit:cover}
.th .pg{position:absolute;left:4px;bottom:4px;background:var(--ink);color:var(--paper);font-size:11px;border-radius:4px;padding:0 5px}
.th .rm{position:absolute;right:2px;top:2px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:17px;line-height:1;padding:0}
.outbox{border:1px dashed var(--unpaid);background:var(--unpaid-soft);color:var(--unpaid);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.dup{color:var(--late);font-weight:600;font-size:12px}
.dupbox{color:var(--late)}
details.hist{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
details.hist summary{cursor:pointer;font-weight:600;font-size:14px;padding:2px 0}
.hrow{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
@media (max-width:420px){.hrow{grid-template-columns:1fr;gap:2px}}
.secnav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px}
.secnav button{border:0;background:transparent;border-radius:9px;padding:12px 10px;font-weight:600;font-size:15px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.secnav button small{font-weight:500;font-size:12px;font-family:var(--f-num);color:inherit;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.secnav button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
@media (max-width:520px){.secnav button{font-size:13.5px;padding:10px 6px}}
.osum{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.osum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rtable{width:100%;border-collapse:collapse;font-size:14px}
.rtable th,.rtable td{padding:10px 16px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.rtable th:first-child,.rtable td:first-child{text-align:left;white-space:normal}
.rtable thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.rtable td{font-family:var(--f-num)} .rtable td:first-child{font-family:var(--f-body)}
.rtable tr.tot td{font-weight:700;border-top:1px solid var(--line-strong)}
.rtable tr.sub td:first-child{padding-left:30px;color:var(--muted)}
.rscroll{overflow-x:auto}
.rhead{padding:14px 16px 4px;font-weight:600;font-size:15px}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line)}
.big3>div{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.big3 .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.big3 .val{font-family:var(--f-num);font-size:clamp(17px,3vw,22px);font-weight:600;overflow-wrap:anywhere}
@media (max-width:640px){.big3{grid-template-columns:1fr}}
.neg{color:var(--late)} .pos{color:var(--paid)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Регистър фактури</h1><p class="sub" id="subLine">Зареждам…</p></div>

<script>
window.onerror = function (m) { var n = document.getElementById("notice"); if (n) { n.hidden = false; n.textContent = "Грешка в страницата: " + m; } };
const EXEC_URL = "https://script.google.com/macros/s/AKfycbxMwqSsJnRu5aQKS0vpfFh33O3fe5ZPcUUNATfucAvCRGeXDWDCR3y9qge6eERC9ORl/exec";
let TOKEN = "";
try { TOKEN = (new URLSearchParams(location.search).get("k") || localStorage.getItem("fakturi_k") || "").trim(); if (TOKEN) localStorage.setItem("fakturi_k", TOKEN); } catch (e) { TOKEN = (new URLSearchParams(location.search).get("k") || "").trim(); }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
(() => {
  const RATE = 1.95583;
  const $ = s => document.querySelector(s);
  const S = { me: null, cats: [], pending: [], register: [], mine: [], people: [], ai: false, view: "queue", filter: "all", method: "", draftPay: "Неплатена", draftMethod: "Банка", month: "", cat: "", q: "", drawer: null, draftPaid: false, upPaid: false, sec: "in", out: [], outCats: [], ofilter: "all", omethod: "", oq: "" };
  try { const sv = localStorage.getItem("fakturi_sec"); if (["in", "out", "recap"].includes(sv)) S.sec = sv; } catch (e) {}

  // ---------- helpers ----------
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDate = iso => iso ? String(iso).slice(0, 10).split("-").reverse().join(".") : "—";
  const nf = new Intl.NumberFormat("bg-BG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Всички суми се показват в евро; стари записи в лева се преобразуват по фиксирания курс
  const toE = (v, cur) => (v == null || v === "" || isNaN(v)) ? v : (cur === "BGN" ? Math.round(v / 1.95583 * 100) / 100 : +v);
  const money = (v, cur) => (v == null || v === "" || isNaN(v)) ? "—" : nf.format(toE(v, cur)) + " €";
  const r2 = v => Math.round((+v + Number.EPSILON) * 100) / 100;
  const eur = o => o.totalEur != null ? +o.totalEur : (o.total == null ? 0 : (o.currency === "BGN" ? r2(o.total / RATE) : +o.total));
  const parseNum = s => { if (s == null) return null; s = String(s).replace(/\s/g, "").replace(/[^\d.,-]/g, ""); if (!s) return null;
    if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    else s = s.replace(",", "."); const n = parseFloat(s); return isNaN(n) ? null : r2(n); };
  const isPaid = o => o.payment === "Платена";
  const isPart = o => o.payment === "Частично";
  const methodOf = o => o.method === "Кеш" ? "Кеш" : "Банка";
  const paidE = o => isPaid(o) ? eur(o) : isPart(o) ? Math.min(eur(o), toE(+o.paidAmount || 0, o.currency)) : 0;
  const dueE = o => r2(eur(o) - paidE(o));
  const isLate = o => !isPaid(o) && o.due && o.due < todayISO();
  const MONTHS = ["Януари","Февруари","Март","Април","Май","Юни","Юли","Август","Септември","Октомври","Ноември","Декември"];
  const monthLabel = ym => { const [y, m] = ym.split("-"); return MONTHS[+m - 1] + " " + y; };
  const plural = n => n === 1 ? "1 фактура" : n + " фактури";
  const isAdmin = () => S.me && S.me.role === "Админ";
  const seesAll = () => S.me && (S.me.role === "Админ" || S.me.role === "Вижда всичко");
  let tT; const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 3800); };
  const notice = m => { $("#notice").textContent = m; $("#notice").hidden = !m; };
  const api = async (fn, ...args) => {
    let r;
    const soft = m => { const er = new Error(m); er.retry = true; return er; };
    try { r = await fetch(EXEC_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, k: TOKEN, args }) }); }
    catch (e) { throw soft("Няма връзка с интернет."); }
    let j; try { j = await r.json(); } catch (e) { throw soft("Сървърът не отговори. Ще опитам пак след малко."); }
    if (!j.ok) throw new Error(j.error || "Нещо се обърка.");
    return j.data;
  };
  const errMsg = e => (e && e.message ? e.message : "Нещо се обърка.").replace(/^Error:\s*/, "").replace(/^Exception:\s*/, "");

  // ---------- моментални действия: екранът се сменя веднага, записът върви отзад, по ред ----------
  let actQ = Promise.resolve(), actN = 0, syncT;
  const setSync = () => { $("#syncDot").hidden = !actN; };
  function act(label, fn) {
    actN++; clearTimeout(syncT); setSync();
    actQ = actQ.then(async () => {
      try {
        for (let t = 0; ; t++) {
          try { await fn(); break; }
          catch (e) { if (!e.retry || t >= 4) throw e; await new Promise(z => setTimeout(z, 2000 * (t + 1))); }
        }
      } catch (e) { toast(label + ": " + errMsg(e) + " Връщам последното записано състояние."); actN--; setSync(); await load(true, true); actN++; }
      finally { actN--; setSync(); if (!actN) syncT = setTimeout(() => load(true), 20000); }
    });
    return actQ;
  }
  const putList = (list, o) => { const i = S[list].findIndex(x => x.id === o.id); if (i >= 0) S[list][i] = o; else S[list].unshift(o); };
  const dropList = (list, id) => { S[list] = S[list].filter(x => x.id !== id); };
  const changed = () => { dupIndex = null; render(); };

  // ---------- data ----------
  function apply(d) {
    Object.assign(S, { me: d.me, cats: d.cats, ai: d.ai, aiError: d.aiError || "", accountant: !!d.accountant, pending: d.pending || [], register: d.register || [], mine: d.mine || [], people: d.people || [], kasa: d.kasa || [], out: d.out || [], outCats: d.outCats || [] });
    dupIndex = null;
  }
  async function load(quiet, force) {
    if (quiet && actN && !force) return;
    try {
      const d = await api("apiInit");
      apply(d);
      try { localStorage.setItem("fakturi_cache", JSON.stringify({ at: Date.now(), k: TOKEN, d })); } catch (e) {}
      if (!quiet || !S.shown) { applyRole(); S.shown = true; }

      if (isAdmin() && S.aiError) notice("Claude не разчита фактурите: " + S.aiError + " Провери ключа в таблицата (лист „Настройки“, клетка B5).");

      if (seesAll() && !S.pre) { S.pre = 1; setTimeout(() => { loadPdf(); prefetch(S.pending.slice(0, 2).map(x => x.id)); }, 1500); }
    } catch (e) {
      if (e.retry && !S.me) {
        let c = null; try { c = JSON.parse(localStorage.getItem("fakturi_cache") || "null"); } catch (x) {}
        if (c && c.k === TOKEN) {
          apply(c.d); applyRole(); S.shown = true; S.offline = true; render();
          notice("Няма интернет. Показвам данните от " + new Date(c.at).toLocaleString("bg-BG", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) + ". Снимките, които качиш сега, ще се изпратят сами, щом има връзка.");

  }

  function applyRole() {

  }

  // ---------- дубликати ----------
  const normS = s => String(s || "").toLowerCase().replace(/["'„“”«»]/g, "").replace(/(^|[\s,.])(еоод|оод|еад|ад|ет|eood|ood|ltd|llc)(?=$|[\s,.])/g, " ").replace(/[^a-zа-я0-9]/g, "");
  const normN = s => String(s || "").replace(/\D/g, "").replace(/^0+/, "");
  function dupKeys(o) {
    const k = [], n = normN(o.number), eik = normN(o.eik), sup = normS(o.supplier);
    if (n.length >= 3) { if (eik) k.push("e|" + eik + "|" + n); if (sup) k.push("s|" + sup + "|" + n); }
    if (sup && o.date && o.total != null && o.total !== "") k.push("d|" + sup + "|" + String(o.date).slice(0, 10) + "|" + Number(o.total).toFixed(2));
    return k;
  }
  let dupIndex = null;
  function buildDup() {
    dupIndex = new Map();
    S.pending.map(o => [o, "pending"]).concat(S.register.map(o => [o, "register"])).forEach(([o, where]) => dupKeys(o).forEach(k => { if (!dupIndex.has(k)) dupIndex.set(k, []); dupIndex.get(k).push({ o, where }); }));
  }
  function dupsOf(o) {
    if (!dupIndex) buildDup();
    const seen = new Set(), out = [];
    dupKeys(o).forEach(k => (dupIndex.get(k) || []).forEach(x => { if (x.o.id !== o.id && !seen.has(x.o.id)) { seen.add(x.o.id); out.push(x); } }));
    return out;
  }
  const dupTag = o => seesAll() && dupsOf(o).length ? ' · <span class="dup">Възможен дубликат</span>' : "";
  const aiTag = o => o.ai === "чака" ? ' · <span class="hint">Claude разчита…</span>' : o.ai === "грешка" ? ' · <span class="hint">не се разчете</span>' : "";

  // ---------- история ----------

    } catch (e) { box.innerHTML = `<div class="hint" style="padding:8px 0">${esc(errMsg(e))}</div>`; }

  // ---------- render ----------
  function filtered() {
    const q = S.q.trim().toLowerCase();

    }).sort((a, b) => String(b.date || b.uploadedAt).localeCompare(String(a.date || a.uploadedAt)));
  }
  const owedMap = () => { const m = {}; S.register.filter(o => o.paidBy && o.reimbursed !== "Да").forEach(o => { (m[o.paidBy] = m[o.paidBy] || { sum: 0, n: 0, pend: 0 }); m[o.paidBy].sum += eur(o); m[o.paidBy].n++; });
    S.pending.filter(o => o.paidBy).forEach(o => { (m[o.paidBy] = m[o.paidBy] || { sum: 0, n: 0, pend: 0 }); m[o.paidBy].pend += eur(o); }); return m; };

  function render() {

    $("#catSel").innerHTML = '<option value="">Всички разходи</option>' + used.map(c => `<option>${esc(c)}</option>`).join("");
    $("#catSel").value = used.includes(S.cat) ? S.cat : ""; S.cat = $("#catSel").value;

    const inSec = S.sec === "in";
    renderSecNav();
    ["#summary", "#upCard", "#tabs", "#view"].forEach(q => $(q).hidden = !inSec);
    $("#outSec").hidden = S.sec !== "out"; $("#recapSec").hidden = S.sec !== "recap"; $("#kasaSum").hidden = S.sec === "out";
    $("#pkgBtn").hidden = $("#bankBtn").hidden = !(isAdmin() && inSec);
    if (!inSec) { $("#toolbar").hidden = true; return S.sec === "out" ? renderOut() : renderRecap(); }
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.v === S.view));
    $("#toolbar").hidden = !(S.view === "list" || S.view === "cats");
    ({ queue: renderQueue, list: renderList, cats: renderCats, owe: renderOwe, kasa: renderKasa })[S.view]();
  }

  const payTag = o => isPart(o) ? `<small class="tu">Частично: платени ${money(paidE(o))}</small>` : isPaid(o) ? (o.paidBy && !isAdmin() && S.me.name === o.paidBy ? '<small class="tp">Платих я аз</small>' : `<small class="tp">Платена${o.paidBy ? " от " + esc(o.paidBy) : ""}</small>`) : '<small class="tu">Неплатена</small>';

  function renderQueue() {
    const v = $("#view");
    if (!S.pending.length) { v.innerHTML = `<div class="empty"><b>Няма фактури за одобрение</b><span>${isAdmin() ? "Новите качвания ще чакат тук, докато ги одобриш." : "Качените фактури чакат тук, докато администраторът ги одобри."}</span></div>`; return; }
    v.innerHTML = S.pending.slice().sort((a, b) => String(a.uploadedAt).localeCompare(String(b.uploadedAt))).map(o => `
      <button class="row" type="button" data-p="${esc(o.id)}">

  function renderList() {

    v.innerHTML = rows.map(o => { const late = isLate(o);
      const st = isPaid(o) ? '<span class="stamp paid">Платена</span>' : isPart(o) ? `<span class="stamp ${late ? "late" : "part"}">${late ? "Просрочена" : "Частично"}</span>` : `<span class="stamp ${late ? "late" : "unpaid"}">${late ? "Просрочена" : "Неплатена"}</span>`;
      const owe = o.paidBy ? (o.reimbursed === "Да" ? ` · върнати на ${esc(o.paidBy)}` : ` · <b class="ta" style="display:inline">дължиш на ${esc(o.paidBy)}</b>`) : "";

      `<div class="foot"><span>${plural(rows.length)}</span><span>Неплатени (остатък) <b class="num">${money(r2(rows.reduce((s, o) => s + dueE(o), 0)))}</b> · Общо <b class="num">${money(r2(rows.reduce((s, o) => s + eur(o), 0)))}</b></span></div>`;
  }

  function renderCats() {

    const m = {}; rows.forEach(o => { const c = o.category || "Други"; m[c] = m[c] || { p: 0, u: 0, n: 0 }; m[c].p += paidE(o); m[c].u += dueE(o); m[c].n++; });
    const arr = Object.entries(m).sort((a, b) => (b[1].p + b[1].u) - (a[1].p + a[1].u));

      arr.map(([c, o]) => `<div class="bar" data-cat="${esc(c)}" style="cursor:pointer"><span class="nm">${esc(c)}<small>${plural(o.n)} · ${tot ? Math.round((o.p + o.u) / tot * 100) : 0}%</small></span><span class="track"><span class="fp" style="width:${o.p / max * 100}%"></span><span class="fu" style="width:${o.u / max * 100}%"></span></span><span class="v">${money(r2(o.p + o.u))}</span></div>`).join("") +
      `<div class="foot"><span>Общо разходи</span><b class="num">${money(r2(tot))}</b></div>`;
  }

  // ---------- каса ----------
  function ledger(k) {
    const e = [];
    (S.kasa || []).filter(x => x.reg === k).forEach(x => e.push({ date: x.date, amt: +x.amount || 0, label: x.type + (x.note ? " — " + x.note : ""), kid: x.id, type: x.type }));
    S.register.forEach(o => {
      if (o.paidBy) { if (k === "Кеш" && o.reimbursed === "Да") e.push({ date: o.reimbursedAt || o.paidDate || o.date, amt: -eur(o), label: "Върнати на " + o.paidBy + " · " + (o.supplier || "фактура"), rid: o.id }); return; }
      if (methodOf(o) !== k) return;
      const p = paidE(o); if (p > 0) e.push({ date: o.paidDate || o.date || o.uploadedAt, amt: -p, label: (o.supplier || "Фактура") + (o.number ? " № " + o.number : "") + (isPart(o) ? " (частично)" : ""), rid: o.id });
    });
    (S.out || []).forEach(o => { if (methodOf(o) !== k) return; const p = oPaid(o); if (p > 0) e.push({ date: o.paidDate || o.date, amt: p, label: "Получено от " + (o.client || "клиент") + (o.number ? " № " + o.number : "") + (isPart(o) ? " (частично)" : ""), oid: o.id }); });
    const op = e.filter(x => x.type === "Начално салдо").sort((a, b) => String(a.date).localeCompare(String(b.date))).pop();
    const list = (op ? e.filter(x => x === op || (x.type !== "Начално салдо" && String(x.date) >= String(op.date))) : e)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)) || (a.type === "Начално салдо" ? -1 : b.type === "Начално салдо" ? 1 : 0));
    return { list, op };
  }
  function kasaStats(k) {
    const { list, op } = ledger(k), m = S.month;
    const R = a => r2(a.reduce((s, x) => s + x.amt, 0));
    const isOp = x => x.type === "Начално салдо";
    if (!m) return { op, start: op ? op.amt : 0, in: R(list.filter(x => x.amt > 0 && !isOp(x))), out: R(list.filter(x => x.amt < 0)), end: R(list), rows: list.slice(-40).reverse() };
    const before = list.filter(x => String(x.date) < m + "-01"), cur = list.filter(x => String(x.date).slice(0, 7) === m);
    const start = r2(R(before) + R(cur.filter(isOp))), inn = R(cur.filter(x => x.amt > 0 && !isOp(x))), out = R(cur.filter(x => x.amt < 0));
    return { op, start, in: inn, out, end: r2(start + inn + out), rows: cur.slice().reverse() };
  }
  S.kform = null;
  function renderKasa() {
    const v = $("#view");

      return `<div class="kbox"><h3>Каса — ${k.toLowerCase()}</h3>
        <div class="kbal">${money(st.end)}</div><div class="hint">${S.month ? "в края на " + monthLabel(S.month) : "текущ баланс"}${st.op ? " · начално салдо от " + fmtDate(st.op.date) : " · няма начално салдо"}</div>

        ${isAdmin() ? (f ? `<div class="kform" data-kf="${k}">
            <div class="fld full"><label>Вид</label><select id="kfType"><option>Внасяне</option><option>Теглене</option><option value="Прехвърляне">Прехвърляне към ${k === "Кеш" ? "банка" : "кеш"}</option><option>Начално салдо</option></select></div>

            <div class="fld"><label>Дата</label><input id="kfDate" type="date" value="${todayISO()}"></div>
            <div class="fld full"><label>Бележка</label><input id="kfNote" placeholder="напр. внесени от оборота"></div>
            <div class="actions full"><button type="button" class="btn" data-kcancel>Отказ</button><button type="button" class="btn primary" data-ksave="${k}">Запиши</button></div>
          </div>` : `<div class="actions" style="margin:8px 0"><button type="button" class="btn" data-kopen="${k}">+ Движение</button></div>`) : ""}
        ${st.rows.length ? st.rows.map(x => `<div class="krow"><span class="hint">${fmtDate(x.date)}</span><span>${esc(x.label)}</span><span class="a ${x.amt >= 0 ? "plus" : "minus"}">${x.amt >= 0 ? "+" : "−"}${money(Math.abs(x.amt))}</span>${isAdmin() && x.kid ? `<button type="button" data-kdel="${esc(x.kid)}" title="Изтрий движението">✕</button>` : "<span></span>"}</div>`).join("") : '<div class="hint" style="padding:8px 0">Няма движения за този период.</div>'}
      </div>`; }).join("")}</div>
      <p class="hint" style="margin-top:10px">Платените входящи фактури се вадят от касата, а получените плащания по изходящите се добавят — според начина на плащане (банка или кеш) и датата на плащане. Въведи „Начално салдо“ — колко има в касата към дадена дата; плащанията преди нея не се броят. Парите, върнати на колеги за платени от тях фактури, се вадят от кеша.</p>`;
  }
  $("#view").addEventListener("click", async e => {
    const o = e.target.closest("[data-kopen]"); if (o) { S.kform = o.dataset.kopen; renderKasa(); setTimeout(() => $("#kfAmt") && $("#kfAmt").focus(), 50); return; }
    if (e.target.closest("[data-kcancel]")) { S.kform = null; renderKasa(); return; }

  // Таблица (от CSV или Excel) → редове. Заглавният ред се търси в първите 40 реда.
  function bankFromTable(T) {
    T = T.map(r => (r || []).map(c => typeof c === "string" ? c.replace(/^﻿/, "").trim() : c));
    let hi = -1, col = null;
    for (let i = 0; i < Math.min(T.length, 40) && hi < 0; i++) {
      const c = {}; c.details = [];
      T[i].forEach((cell, j) => { const t = bkNorm(cell); if (!t || t.length > 40) return;
        for (const [k, re] of BK_HEAD) if (re.test(t)) { if (k === "details") c.details.push(j); else if (c[k] == null) c[k] = j; break; } });
      if (c.date != null && (c.amount != null || c.debit != null || c.credit != null)) { hi = i; col = c; }

    }
    const out = [];
    data.forEach(r => {

      let amount = null, dir = "";

        const d = col.debit != null ? bkAmt(r[col.debit]) : null, c = col.credit != null ? bkAmt(r[col.credit]) : null;
        if (d) { amount = Math.abs(d); dir = "d"; } else if (c) { amount = Math.abs(c); dir = c < 0 ? "d" : "c"; }
        else if (col.amount != null) { const a = bkAmt(r[col.amount]); if (a) { amount = Math.abs(a); dir = a < 0 ? "d" : ""; } }
      } else {
        const a = bkAmt(r[col.amount]); if (!a) return; amount = Math.abs(a);
        dir = col.dir != null ? bkDirVal(r[col.dir]) : "";
        if (!dir) dir = a < 0 ? "d" : "";

      const details = col.details.map(j => r[j]).filter(v => v != null && String(v).trim() !== "").join(" · ").replace(/\s+/g, " ").trim();
      const party = col.party != null ? String(r[col.party] || "").trim() : "";

    });

    if (out.length && !out.some(x => x.dir) && col.dir == null) out.forEach(x => x.dir = "");
    else if (out.some(x => x.dir === "d") && col.dir == null && col.debit == null && col.credit == null) out.forEach(x => { if (!x.dir) x.dir = "c"; });
    return out;
  }
  function splitCsv(text) {
    text = text.replace(/^﻿/, "");
    const first = text.split(/\r?\n/).slice(0, 30).join("\n");
    const cnt = ch => (first.match(new RegExp(ch === "|" ? "\\|" : ch, "g")) || []).length;
    const sep = [";", "\t", ",", "|"].sort((a, b) => cnt(b) - cnt(a))[0];
    const rows = []; let row = [], f = "", q = false;
    for (let i = 0; i < text.length; i++) { const ch = text[i];
      if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; continue; }
      if (ch === '"' && f.trim() === "") { q = true; f = ""; }
      else if (ch === sep) { row.push(f); f = ""; }
      else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += ch; }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(r => r.some(c => String(c).trim()));

  // старият формат на Булбанк Онлайн (без разпознаваеми заглавия)

  }
  function parseBankText(text) {

  // ISO 20022 camt.053 / camt.052 / camt.054

    return kids(x, "Ntry").map(n => {

      let amount = Math.abs(parseFloat(amtEl ? amtEl.textContent : "0") || 0); if (amtEl && amtEl.getAttribute("Ccy") === "BGN") amount = r2(amount / RATE);

      const date = bkDate(bd ? (one(bd, "Dt") || one(bd, "DtTm")) : "");

  // PDF извлечение: текстът се чете с pdf.js, редовете се сглобяват по позиция,
  // а дебит/кредит се познава по колоната („Дебит“/„Кредит“), по маркер ДТ/КТ, по знака или по промяната на салдото.
  async function parseBankPdf(file) {

    const lines = [];

    const head = t => { const T = t.toLowerCase().replace(/[^a-zа-я]/g, "");
      return /^(дебит|дт|debit|dr|теглене|разход|разходи|изходящи|withdrawal|withdrawals)$/.test(T) ? "d" : /^(кредит|кт|credit|cr|постъпление|постъпления|приход|приходи|входящи|deposit|deposits)$/.test(T) ? "c" : /^(салдо|balance|наличност)$/.test(T) ? "b" : ""; };
    const isAmt = t => /^[-+]?\d{1,3}(?:[ . ]?\d{3})*,\d{2}-?$|^[-+]?\d{1,3}(?:,\d{3})+\.\d{2}-?$|^[-+]?\d+\.\d{2}-?$/.test(t);
    const dateRe = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2}|\d{4})$|^(\d{4})-(\d{2})-(\d{2})$/;
    const out = []; let cur = null;
    const flush = () => { if (cur && cur.amount) { const details = cur.parts.join(" ").replace(/\s+/g, " ").trim();
      const ref = (details.match(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{10,}\b/) || [""])[0];
      out.push({ date: cur.date, amount: cur.amount, dir: cur.dir, bal: cur.bal, party: "", iban: bkIban(details), details, ref }); } cur = null; };
    lines.forEach(l => {
      const hs = l.toks.map(k => ({ h: head(k.t), x: k.x })).filter(o => o.h);
      if (hs.some(o => o.h === "d") && hs.some(o => o.h === "c")) { flush(); col = {}; hs.forEach(o => col[o.h] = o.x); return; }
      const di = l.toks.slice(0, 3).findIndex(k => dateRe.test(k.t));
      if (bkSkip(l.text) && di < 0) { flush(); return; }
      if (di >= 0) { flush(); cur = { date: bkDate(l.toks[di].t), amount: 0, dir: "", bal: null, parts: [] }; }
      if (!cur) return;
      const amts = [], words = [];
      l.toks.forEach((k, i) => { if (isAmt(k.t)) amts.push(k); else if (!(i < 3 && dateRe.test(k.t))) words.push(k.t); });
      const mark = words.find(w => /^(ДТ|Д|DT|DR|D)$/i.test(w)) ? "d" : words.find(w => /^(КТ|К|KT|CT|CR|C)$/i.test(w)) ? "c" : "";
      cur.parts.push(words.filter(w => !/^(ДТ|КТ|DT|CT|DR|CR)$/i.test(w)).join(" "));
      if (cur.amount || !amts.length) return;
      let pick = null, dir = "";
      if (col) { amts.forEach(a => { let best = "", bd = 1e9; for (const h in col) { const dd = Math.abs(col[h] - a.x); if (dd < bd) { bd = dd; best = h; } }
        if (best === "b") cur.bal = bkAmt(a.t.replace(/[ .](?=\d{3})/g, ""));
        else if (!pick && (best === "d" || best === "c")) { pick = a; dir = best; } }); }
      if (!pick) { pick = amts[0]; dir = mark || (/^-|-$/.test(pick.t) ? "d" : /^\+/.test(pick.t) ? "c" : "");
        if (!col && amts.length > 1) cur.bal = bkAmt(amts[amts.length - 1].t); }
      cur.amount = Math.abs(parseNum(pick.t.replace(/-$/, "")) || 0); cur.dir = mark && !col ? mark : dir;
    });
    flush();
    // посока по салдото: ако салдото е намаляло — изходящо, ако е нараснало — входящо
    out.forEach((r, i) => { if (r.dir || r.bal == null) return; const p = out[i - 1];
      if (p && p.bal != null) { const dlt = r2(r.bal - p.bal); if (Math.abs(Math.abs(dlt) - r.amount) < 0.02) r.dir = dlt < 0 ? "d" : "c"; } });
    if (!col && out.some(r => r.dir === "d") && !out.some(r => r.dir === "c")) out.forEach(r => { if (!r.dir) r.dir = "c"; }); // само минуси → без знак е входящо
    out.forEach(r => delete r.bal);
    return out;
  }
  async function readBankFile(f) {
    const n = f.name.toLowerCase();
    if (isPdfFile(f)) return parseBankPdf(f);
    if (/\.(xlsx|xls|xlsm|ods)$/.test(n) || /spreadsheet|excel/.test(f.type)) return parseBankXlsx(f);
    const buf = new Uint8Array(await f.arrayBuffer());
    if (buf[0] === 0x50 && buf[1] === 0x4b || buf[0] === 0xd0 && buf[1] === 0xcf) return parseBankXlsx(f); // Excel без разширение
    let text = new TextDecoder("utf-8").decode(buf);
    if ((text.match(/�/g) || []).length > 3) text = new TextDecoder("windows-1251").decode(buf); // стари експорти на кирилица
    return parseBankText(text);
  }

  // ---------- съпоставяне: кое плащане към коя фактура ----------
  const bkKey = r => [r.date, r.dir, r.amount.toFixed(2), r.ref || normS(r.details).slice(0, 40)].join("|");
  const bkDone = () => { try { return new Set(JSON.parse(localStorage.getItem("fakturi_bank_done") || "[]")); } catch (e) { return new Set(); } };
  const bkMark = keys => { try { const s = bkDone(); keys.forEach(k => s.add(k)); localStorage.setItem("fakturi_bank_done", JSON.stringify([...s].slice(-3000))); } catch (e) {} };
  const candsFor = dir => dir === "d"
    ? S.register.filter(o => !isPaid(o)).map(o => ({ o, kind: "in", id: o.id, party: o.supplier, due: dueE(o), tot: eur(o), label: (o.supplier || "Без доставчик") + (o.number ? " № " + o.number : "") }))
    : dir === "c" ? (S.out || []).filter(o => !isPaid(o)).map(o => ({ o, kind: "out", id: o.id, party: o.client, due: oDue(o), tot: oTot(o), label: (o.client || "Без клиент") + (o.number ? " № " + o.number : "") })) : [];
  function bkScore(r, c) {
    const text = r.party + " " + r.details + " " + r.ref, nums = new Set((text.match(/\d+/g) || []).map(d => d.replace(/^0+/, ""))), o = c.o;
    let s = 0, ev = 0;
    const nn = normN(o.number); if (nn.length >= 2 && nums.has(nn)) { s += nn.length >= 4 ? 50 : 25; ev++; }
    const eik = normN(o.eik); if (eik.length >= 9 && nums.has(eik)) { s += 30; ev++; }
    if (o.iban && r.iban && bkIban(o.iban) === r.iban) { s += 40; ev++; }
    const pn = normS(c.party), tn = normS(text), rp = normS(r.party);
    if (pn.length >= 4 && (tn.includes(pn) || (rp.length >= 4 && pn.includes(rp)))) { s += 30; ev++; }
    else { const w = String(c.party || "").toLowerCase().split(/[^a-zа-я0-9]+/).filter(x => x.length >= 4 && !/^(еоод|оод|ead|eood|ltd|фирма|търговия)$/.test(x)); if (w.some(x => tn.includes(normS(x)))) { s += 15; ev++; } }
    const amt = Math.abs(r.amount - c.due) < 0.011 ? 40 : Math.abs(r.amount - c.tot) < 0.011 ? 35 : 0; s += amt;
    if (!amt && !(r.amount < c.due && ev && s >= 30)) return 0; // без съвпадение на сумата — само частично плащане с ясна връзка
    if (o.date && r.date && String(o.date).slice(0, 10) > r.date) s -= 20;
    if (!ev && amt) { if (rp.length >= 4) return 1; s = 30; } // само сумата съвпада, а името е друго → не се избира само
    return s;
  }
  function bkMatchAll(rows) {
    const pairs = [];
    rows.forEach((r, i) => { r.cands = candsFor(r.dir).map(c => ({ c, s: bkScore(r, c) })).sort((a, b) => b.s - a.s); r.pick = ""; r.auto = "";
      r.cands.forEach(x => { if (x.s >= 40) pairs.push({ i, x }); });
      const same = r.cands.filter(x => x.s === 30); if (!r.party && same.length === 1 && !r.cands.some(x => x.s >= 40)) pairs.push({ i, x: same[0] }); });
    const used = new Set();
    pairs.sort((a, b) => b.x.s - a.x.s).forEach(({ i, x }) => { const r = rows[i]; if (r.pick || used.has(x.c.id) || r.done) return;
      const tie = r.cands.filter(y => y.s === x.s && !used.has(y.c.id)).length > 1; if (tie && x.s < 70) return; // равни кандидати — нека човек избере
      r.pick = r.auto = x.c.id; used.add(x.c.id); });
  }

  // ---------- преглед на извлечението ----------
  let BK = null;
  function bankOpen(rows, fname) {
    const done = bkDone();
    rows.forEach(r => { r.done = done.has(bkKey(r)); });
    bkMatchAll(rows);
    BK = { rows, fname, f: "all", result: null };
    if (!$("#bScrim")) {
      const d = document.createElement("div"); d.className = "scrim"; d.id = "bScrim"; d.hidden = true;
      d.innerHTML = `<div class="drawer bdrawer"><div class="dh"><h3 id="bTitle">Банково извлечение</h3><button class="x" type="button" id="bClose" aria-label="Затвори">×</button></div><div id="bBody" class="bbody"></div><div class="dfoot" id="bFoot"></div></div>`;
      document.body.appendChild(d);
      d.onclick = e => { if (e.target.id === "bScrim" || e.target.closest("#bClose") || e.target.closest("[data-bclose]")) d.hidden = true; };
      d.addEventListener("change", e => { const s = e.target.closest("[data-bpick]"), dd = e.target.closest("[data-bdir]");
        if (s) BK.rows[+s.dataset.bpick].pick = s.value;
        if (dd) { const r = BK.rows[+dd.dataset.bdir]; r.dir = dd.value; r.cands = candsFor(r.dir).map(c => ({ c, s: bkScore(r, c) })).sort((a, b) => b.s - a.s); r.pick = r.cands[0] && r.cands[0].s >= 40 ? r.cands[0].c.id : ""; bankRender(); } });
      d.addEventListener("click", e => { const f = e.target.closest("[data-bf]"); if (f) { BK.f = f.dataset.bf; bankRender(); } });
      document.addEventListener("keydown", e => { if (e.key === "Escape" && !d.hidden) d.hidden = true; });
    }
    bankRender(); $("#bScrim").hidden = false;
  }
  function bankRender() {
    const R = BK.rows, sum = a => money(r2(a.reduce((t, r) => t + r.amount, 0)));
    const inc = R.filter(r => r.dir === "c"), outg = R.filter(r => r.dir === "d"), unk = R.filter(r => !r.dir);
    $("#bTitle").textContent = BK.result ? "Извлечението е записано" : "Банково извлечение";
    const head = `<div class="bstats"><div><span>Входящи</span><b class="ok">${sum(inc)}</b><small>${inc.length} плащания · ${inc.filter(r => r.pick).length} към фактури</small></div><div><span>Изходящи</span><b class="minus">${sum(outg)}</b><small>${outg.length} плащания · ${outg.filter(r => r.pick).length} към фактури</small></div></div>`
      + (unk.length ? `<p class="status rej">${unk.length} реда без ясна посока — избери „Входящо“ или „Изходящо“ за тях.</p>` : "")
      + `<p class="hint">${esc(BK.fname)} · ${R.length} операции. ${BK.result ? "Ето къде отиде всяко плащане." : "Провери към коя фактура отива всяко плащане и натисни „Запиши“. Входящите плащания се търсят сред изходящите фактури (от клиенти), изходящите — сред входящите фактури (към доставчици)."}</p>`;
    const chips = `<div class="chips">${[["all", "Всички"], ["c", "Входящи"], ["d", "Изходящи"], ["none", "Без фактура"]].map(([k, l]) => `<button type="button" class="chip" data-bf="${k}" aria-pressed="${BK.f === k}">${l}</button>`).join("")}</div>`;
    const vis = R.map((r, i) => [r, i]).filter(([r]) => BK.f === "all" || (BK.f === "none" ? !r.pick : r.dir === BK.f));
    const rowH = ([r, i]) => {
      const lab = r.dir === "c" ? '<span class="bdir in">↓ Входящо</span>' : r.dir === "d" ? '<span class="bdir out">↑ Изходящо</span>' : "";
      const dirSel = (!r.dir || r.manualDir) && !BK.result ? `<select data-bdir="${i}"><option value="">Посока?</option><option value="c"${r.dir === "c" ? " selected" : ""}>↓ Входящо</option><option value="d"${r.dir === "d" ? " selected" : ""}>↑ Изходящо</option></select>` : lab;
      if (!r.dir) r.manualDir = true;
      let to;
      if (BK.result) { const res = BK.result[i]; to = `<div class="bto ${res && res.ok ? "ok" : ""}">${res ? esc(res.text) : "—"}</div>`; }
      else if (r.done) to = `<div class="bto">Вече е записано при предишно качване</div>`;
      else if (!r.dir) to = `<div class="bto">Избери посока</div>`;
      else {
        const top = r.cands.filter(x => x.s > 0), rest = r.cands.filter(x => x.s <= 0).sort((a, b) => String(b.c.o.date || "").localeCompare(String(a.c.o.date || "")));
        const opt = x => `<option value="${esc(x.c.id)}"${x.c.id === r.pick ? " selected" : ""}>${esc(x.c.label)} — ${money(x.c.due)}${x.c.o.date ? " · " + fmtDate(x.c.o.date) : ""}${x.c.id === r.auto ? " ✓" : ""}</option>`;
        to = `<select class="bsel" data-bpick="${i}"><option value="">— не е по фактура —</option>${top.length ? `<optgroup label="Подходящи">${top.map(opt).join("")}</optgroup>` : ""}${rest.length ? `<optgroup label="Други неплатени ${r.dir === "c" ? "изходящи" : "входящи"} фактури">${rest.map(opt).join("")}</optgroup>` : ""}</select>`;
      }
      return `<div class="brow"><div class="bmeta"><span class="mono">${fmtDate(r.date)}</span>${dirSel}<b class="mono ${r.dir === "c" ? "ok" : r.dir === "d" ? "minus" : ""}">${r.dir === "d" ? "−" : r.dir === "c" ? "+" : ""}${money(r.amount)}</b></div><div class="bdet"><b>${esc(r.party || "")}</b> ${esc(r.details || "")}${r.iban ? ` <span class="mono">${esc(r.iban)}</span>` : ""}</div>${to}</div>`;
    };
    $("#bBody").innerHTML = head + chips + `<div class="blist">${vis.length ? vis.map(rowH).join("") : '<p class="hint">Няма редове.</p>'}</div>`;
    $("#bFoot").innerHTML = BK.result ? '<span></span><button type="button" class="btn primary" data-bclose>Готово</button>'
      : `<span class="hint">${R.filter(r => r.pick && !r.done).length} плащания ще отбележат фактури</span><div class="actions"><button type="button" class="btn" data-bclose>Отказ</button><button type="button" class="btn primary" id="bSave">Запиши</button></div>`;
    const sv = $("#bSave"); if (sv) sv.onclick = () => run(sv, "Записвам…", bankApply);
  }
  const payState = (paidBefore, add, total) => { const p = r2(paidBefore + add); return p >= total - 0.01 ? { payment: "Платена", paidAmount: null } : { payment: "Частично", paidAmount: p }; };
  async function bankApply() {
    const R = BK.rows, res = {};
    if (R.some(r => !r.dir && !r.done)) { const n = R.filter(r => !r.dir).length; if (!BK.warned) { BK.warned = 1; throw new Error(`${n} реда нямат посока и ще бъдат пропуснати. Натисни „Запиши“ пак, за да продължиш.`); } }
    const before = new Map(S.register.map(o => [o.id, paidE(o)]));
    // 1) изходящите плащания — в листа „Банка“ на сървъра (той отбелязва доставните фактури)
    const deb = R.map((r, i) => [r, i]).filter(([r]) => r.dir === "d" && !r.done);
    let srv = null;
    if (deb.length) srv = await api("apiImportBank", deb.map(([r]) => ({ date: r.date, amount: r.amount, details: [r.party, r.details].filter(Boolean).join(" · "), kind: r.kind || "", ref: r.ref, iban: r.iban, invoiceId: r.pick || "" })));
    // 2) входящите плащания — отбелязват изходящите фактури
    const cr = R.map((r, i) => [r, i]).filter(([r]) => r.dir === "c" && !r.done);
    for (const [r, i] of cr) {
      const o = r.pick && (S.out || []).find(x => x.id === r.pick);
      if (!o) { res[i] = { text: "Не е по фактура" }; continue; }
      const st = payState(oPaid(o), r.amount, oTot(o));
      const f = { id: o.id, client: o.client || "", eik: o.eik || "", category: o.category || "", number: o.number || "", date: o.date || "", due: o.due || "", note: o.note || "",
        net: o.net, vat: o.vat, total: o.total, vatRate: o.vatRate, payment: st.payment, method: "Банка", paidDate: r.date, paidAmount: st.paidAmount };
      try { const x = await api("apiOutSave", f); const j = S.out.findIndex(y => y.id === x.o.id); if (j >= 0) S.out[j] = x.o;
        res[i] = { ok: 1, text: `→ Изходяща фактура: ${o.client || "клиент"}${o.number ? " № " + o.number : ""} — ${st.payment === "Платена" ? "платена" : "частично (" + money(st.paidAmount) + ")"}` };
      } catch (e) { res[i] = { text: "Грешка: " + errMsg(e) }; }
    }
    await load(true, true);
    // 3) изходящи плащания, които сървърът не е вързал, а са избрани ръчно — отбелязват се тук
    for (const [r, i] of deb) {
      let o = S.register.find(x => x.id === r.pick);
      if (o && paidE(o) <= (before.get(o.id) || 0) + 0.005 && !isPaid(o)) {
        const st = payState(paidE(o), r.amount, eur(o));
        const f = { supplier: o.supplier || "", eik: o.eik || "", number: o.number || "", date: o.date || "", due: o.due || "", note: o.note || "", paidDate: r.date, iban: o.iban || "", category: o.category || "", currency: o.currency || "EUR",
          net: o.net, vat: o.vat, total: o.total, vatRate: o.vatRate, payment: st.payment, method: "Банка", paidAmount: st.paidAmount != null && o.currency === "BGN" ? r2(st.paidAmount * RATE) : st.paidAmount };
        try { const x = await api("apiUpdate", o.id, f); if (x && x.o) { putList("register", x.o); o = x.o; } } catch (e) { res[i] = { text: "Грешка: " + errMsg(e) }; continue; }
      }
      if (o && paidE(o) > (before.get(o.id) || 0) + 0.005) { before.set(o.id, 1e12); res[i] = { ok: 1, text: `→ Входяща фактура: ${o.supplier || "доставчик"}${o.number ? " № " + o.number : ""} — ${isPaid(o) ? "платена" : "частично"}` }; }
    }
    // фактури, отбелязани от сървъра по негова преценка
    S.register.forEach(o => { const b = before.get(o.id); if (b == null || b > 1e11 || paidE(o) <= b + 0.005) return;
      const hit = deb.find(([r, i]) => !res[i] && Math.abs(r.amount - r2(paidE(o) - b)) < 0.02);
      if (hit) res[hit[1]] = { ok: 1, text: `→ Входяща фактура: ${o.supplier || "доставчик"}${o.number ? " № " + o.number : ""} — ${isPaid(o) ? "платена" : "частично"}` }; });
    deb.forEach(([r, i]) => { if (!res[i]) res[i] = { text: "Записано в лист „Банка“, без фактура" }; });
    R.forEach((r, i) => { if (r.done) res[i] = { text: "Вече беше записано" }; else if (!r.dir) res[i] = { text: "Пропуснато — без посока" }; });
    bkMark(R.filter(r => r.dir && !r.done).map(bkKey));
    BK.result = res; BK.f = "all"; changed(); bankRender();
    const ok = Object.values(res).filter(x => x.ok).length;
    toast(`Извлечение: ${cr.length} входящи и ${deb.length} изходящи плащания. ${ok} фактури са отбелязани.${srv && srv.added != null ? " Нови в лист „Банка“: " + srv.added + "." : ""}`);
  }

  $("#bankBtn").onclick = () => $("#bankIn").click();
  $("#bankIn").onchange = async () => {
    const f = $("#bankIn").files[0]; $("#bankIn").value = ""; if (!f) return;
    const b = $("#bankBtn"); b.disabled = true; b.textContent = "Чета…";
    try {
      const rows = (await readBankFile(f)).filter(r => r && r.date && r.amount > 0);
      if (!rows.length) throw new Error("Не намерих плащания във файла. Свали извлечението от онлайн банкирането като Excel, CSV, XML (camt.053), MT940 или PDF.");
      bankOpen(rows, f.name);
    } catch (e) { toast(errMsg(e)); }
    finally { b.disabled = false; b.textContent = "Банково извлечение"; }
  };

  const armed = new Set();
  $("#view").addEventListener("click", async e => {
    const pay = e.target.closest("[data-pay]");
    if (pay) {
      const n = pay.dataset.pay;
      if (!armed.has(n)) { armed.add(n); pay.textContent = "Потвърди изплащането"; pay.classList.add("primary"); return; }
      armed.delete(n);
      let sum = 0; const today = todayISO();
      S.register = S.register.map(o => { if (o.paidBy === n && o.reimbursed !== "Да") { sum += eur(o); return Object.assign({}, o, { reimbursed: "Да", reimbursedAt: today }); } return o; });
      changed(); toast(`Отбелязано: върнати ${money(r2(sum))} на ${n}`);
      act("Изплащането не се записа", () => api("apiReimburse", n));
      return;
    }
    const b = e.target.closest("[data-cat]"); if (b) { S.cat = b.dataset.cat; S.view = "list"; render(); return; }
    const p = e.target.closest("[data-p]"); if (p) return openDoc(S.pending.find(o => o.id === p.dataset.p), "pending");
    const r = e.target.closest("[data-r]"); if (r) return openDoc(S.register.find(o => o.id === r.dataset.r), "register");
    const m = e.target.closest("[data-m]"); if (m) return openDoc(S.mine.find(o => o.id === m.dataset.m), "mine");
  });

      const del = $("#oDel"); if (del) armBtn(del, "Потвърди изтриването", async () => { const id = oCur.id; await api("apiOutDelete", id); S.out = S.out.filter(x => x.id !== id); oClose(); render(); toast("Изтрита"); });
    }
    $("#oScrim").hidden = false;
  }

  // ----- рекапитулация -----
  const iNet = o => o.net != null && o.net !== "" ? toE(+o.net, o.currency) : r2(eur(o) - (o.vat != null && o.vat !== "" ? toE(+o.vat, o.currency) : 0));
  const iVat = o => o.vat != null && o.vat !== "" ? toE(+o.vat, o.currency) : 0;
  const oNet = o => o.net != null ? +o.net : oTot(o);
  const oVat = o => o.vat != null ? +o.vat : 0;
  function recapOf(inc, exp) {
    const S2 = (a, f) => r2(a.reduce((s, o) => s + f(o), 0));
    return { iN: inc.length, iT: S2(inc, oTot), iNet: S2(inc, oNet), iVat: S2(inc, oVat), iGot: S2(inc, oPaid), iDue: S2(inc, oDue),
      eN: exp.length, eT: S2(exp, eur), eNet: S2(exp, iNet), eVat: S2(exp, iVat), ePaid: S2(exp, paidE), eDue: S2(exp, dueE) };
  }
  function renderRecap() {
    const inc = (S.out || []).filter(inPerOut), exp = S.register.filter(inPerIn), R = recapOf(inc, exp);
    const res = r2(R.iNet - R.eNet), vatPay = r2(R.iVat - R.eVat), flow = r2(R.iGot - R.ePaid);
    const sg = v => `<span class="${v < 0 ? "neg" : v > 0 ? "pos" : ""}">${v < 0 ? "−" : ""}${money(Math.abs(v))}</span>`;
    const per = S.month ? monthLabel(S.month) : "всичко до днес";
    let h = `<div class="rhead">Рекапитулация — ${esc(per)}</div>
      <div class="big3"><div><span class="lbl">Резултат (без ДДС)</span><span class="val">${sg(res)}</span><span class="hint">${res >= 0 ? "печалба" : "загуба"}: приходи минус разходи</span></div>
        <div><span class="lbl">${vatPay >= 0 ? "ДДС за внасяне" : "ДДС за възстановяване"}</span><span class="val">${money(Math.abs(vatPay))}</span><span class="hint">ДДС по продажби ${money(R.iVat)} − по покупки ${money(R.eVat)}</span></div>
        <div><span class="lbl">Парично (получено − платено)</span><span class="val">${sg(flow)}</span><span class="hint">получени ${money(R.iGot)} · платени ${money(R.ePaid)}</span></div></div>
      <div class="rscroll"><table class="rtable"><thead><tr><th></th><th>Брой</th><th>Без ДДС</th><th>ДДС</th><th>Общо</th><th>Платено</th><th>Остава</th></tr></thead><tbody>
        <tr><td><b>Приходи</b> — изходящи фактури</td><td>${R.iN}</td><td>${money(R.iNet)}</td><td>${money(R.iVat)}</td><td>${money(R.iT)}</td><td>${money(R.iGot)}</td><td>${money(R.iDue)}</td></tr>
        <tr><td><b>Разходи</b> — входящи фактури</td><td>${R.eN}</td><td>${money(R.eNet)}</td><td>${money(R.eVat)}</td><td>${money(R.eT)}</td><td>${money(R.ePaid)}</td><td>${money(R.eDue)}</td></tr>
        <tr class="tot"><td>Разлика</td><td></td><td>${sg(res)}</td><td>${sg(vatPay)}</td><td>${sg(r2(R.iT - R.eT))}</td><td>${sg(flow)}</td><td>${sg(r2(R.iDue - R.eDue))}</td></tr>
      </tbody></table></div>
      <div class="foot"><span>Вземания от клиенти <b class="num">${money(R.iDue)}</b></span><span>Задължения към доставчици <b class="num">${money(R.eDue)}</b></span></div>`;
    if (!S.month) {
      const ms = [...new Set(S.register.map(o => String(o.date || o.uploadedAt).slice(0, 7)).concat((S.out || []).map(o => String(o.date || "").slice(0, 7))).filter(Boolean))].sort().reverse();
      h += `<div class="rhead" style="border-top:1px solid var(--line-strong)">По месеци</div><div class="rscroll"><table class="rtable"><thead><tr><th>Месец</th><th>Приходи без ДДС</th><th>Разходи без ДДС</th><th>Резултат</th><th>ДДС продажби</th><th>ДДС покупки</th><th>ДДС за внасяне</th></tr></thead><tbody>` +
        ms.map(m => { const x = recapOf((S.out || []).filter(o => String(o.date || "").slice(0, 7) === m), S.register.filter(o => String(o.date || o.uploadedAt).slice(0, 7) === m));
          return `<tr data-rm="${m}" style="cursor:pointer"><td>${monthLabel(m)}</td><td>${money(x.iNet)}</td><td>${money(x.eNet)}</td><td>${sg(r2(x.iNet - x.eNet))}</td><td>${money(x.iVat)}</td><td>${money(x.eVat)}</td><td>${sg(r2(x.iVat - x.eVat))}</td></tr>`; }).join("") +
        `</tbody></table></div><div class="foot"><span class="hint">Натисни месец, за да видиш само него.</span><span></span></div>`;
    }
    $("#recapSec").innerHTML = h;
  }
  $("#recapSec").addEventListener("click", e => { const r = e.target.closest("[data-rm]"); if (r) { S.month = r.dataset.rm; render(); } });

  function exportOther() {
    if (!window.XLSX) return toast("Excel модулът не се зареди. Обнови страницата.");
    const d = s => s ? new Date(String(s).slice(0, 10) + "T00:00:00") : null, wb = XLSX.utils.book_new();
    if (S.sec === "out") {
      const rows = outFiltered().slice().reverse(); if (!rows.length) return toast("Няма изходящи фактури в този изглед.");
      const aoa = [["Статус", "№ фактура", "Дата", "Падеж", "Клиент", "ЕИК", "Вид приход", "Без ДДС", "ДДС", "Общо (EUR)", "Начин на плащане", "Дата на плащане", "Получено (EUR)", "Остатък (EUR)", "Бележка"],
        ...rows.map(o => [isPaid(o) ? "Платена" : isPart(o) ? "Частично" : isLate(o) ? "Просрочена" : "Неплатена", o.number || "", d(o.date), d(o.due), o.client || "", o.eik || "", o.category || "", oNet(o), oVat(o), oTot(o), methodOf(o), d(o.paidDate), r2(oPaid(o)), oDue(o), o.note || ""])];
      const last = rows.length + 1; aoa.push([]);
      aoa.push(["", "", "", "", "Общо", "", "", { f: `SUM(H2:H${last})` }, { f: `SUM(I2:I${last})` }, { f: `SUM(J2:J${last})` }, "", "", { f: `SUM(M2:M${last})` }, { f: `SUM(N2:N${last})` }]);
      const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true }), rg = XLSX.utils.decode_range(ws["!ref"]);
      for (let R = 1; R <= rg.e.r; R++) { [2, 3, 11].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c && c.t === "d") c.z = "dd.mm.yyyy"; }); [7, 8, 9, 12, 13].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; }); }
      ws["!cols"] = [12, 14, 12, 12, 30, 14, 16, 12, 12, 13, 12, 13, 13, 13, 30].map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, "Изходящи");
    } else {
      const ms = S.month ? [S.month] : [...new Set(S.register.map(o => String(o.date || o.uploadedAt).slice(0, 7)).concat((S.out || []).map(o => String(o.date || "").slice(0, 7))).filter(Boolean))].sort();
      const aoa = [["Месец", "Приходи без ДДС", "ДДС продажби", "Приходи общо", "Разходи без ДДС", "ДДС покупки", "Разходи общо", "Резултат без ДДС", "ДДС за внасяне", "Получено от клиенти", "Платено на доставчици", "Вземания", "Задължения"]];
      ms.forEach((m, i) => { const x = recapOf((S.out || []).filter(o => String(o.date || "").slice(0, 7) === m), S.register.filter(o => String(o.date || o.uploadedAt).slice(0, 7) === m)), r = i + 2;
        aoa.push([monthLabel(m), x.iNet, x.iVat, x.iT, x.eNet, x.eVat, x.eT, { f: `B${r}-E${r}` }, { f: `C${r}-F${r}` }, x.iGot, x.ePaid, x.iDue, x.eDue]); });
      const L = ms.length + 1; aoa.push(["Общо", ..."BCDEFGHIJKLM".split("").map(c => ({ f: `SUM(${c}2:${c}${L})` }))]);
      const ws = XLSX.utils.aoa_to_sheet(aoa); for (let R = 1; R <= L; R++) for (let C = 1; C <= 12; C++) { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; }
      ws["!cols"] = [18, 15, 13, 14, 15, 13, 14, 15, 14, 16, 18, 13, 13].map(w => ({ wch: w }));
      XLSX.utils.book_append_sheet(wb, ws, "Рекапитулация");
    }
    try { XLSX.writeFile(wb, `${S.sec === "out" ? "Изходящи фактури" : "Рекапитулация"} ${todayISO()}.xlsx`); toast("Excel файлът се изтегля"); }
    catch (e) { toast("Браузърът спря изтеглянето."); }
  }

  // ---------- Excel ----------
  $("#exportBtn").onclick = () => {
    if (S.sec !== "in") return exportOther();
    const rows = filtered().slice().sort((a, b) => String(a.date || a.uploadedAt).localeCompare(String(b.date || b.uploadedAt)));
    if (!rows.length) return toast("Няма одобрени фактури в този изглед.");
    if (!window.XLSX) return toast("Excel модулът не се зареди. Обнови страницата.");
    const d = s => s ? new Date(String(s).slice(0, 10) + "T00:00:00") : null;
    const head = ["Статус", "Вид разход", "Доставчик", "ЕИК", "№ фактура", "Дата", "Падеж", "Без ДДС", "ДДС", "Общо", "Валута", "Общо (EUR)", "Дата на плащане", "Качена от", "Платена лично от", "Парите върнати", "Бележка", "Начин на плащане", "Платено (EUR)", "Остатък (EUR)"];
    const aoa = [head, ...rows.map(o => [isPaid(o) ? "Платена" : isPart(o) ? "Частично" : isLate(o) ? "Просрочена" : "Неплатена", o.category || "Други", o.supplier || "", o.eik || "", o.number || "", d(o.date), d(o.due),
      toE(o.net, o.currency), toE(o.vat, o.currency), toE(o.total, o.currency), "EUR", eur(o), d(o.paidDate), o.uploadedBy || "", o.paidBy || "", o.paidBy ? (o.reimbursed === "Да" ? "Да" : "Не") : "", o.note || "", methodOf(o), r2(paidE(o)), dueE(o)])];
    const last = rows.length + 1;
    aoa.push([]);
    aoa.push(["", "", "Неплатени (EUR)", "", "", "", "", "", "", "", "", { f: `SUM(T2:T${last})` }]);
    aoa.push(["", "", "Платени (EUR)", "", "", "", "", "", "", "", "", { f: `SUM(S2:S${last})` }]);
    aoa.push(["", "", "Общо (EUR)", "", "", "", "", "", "", "", "", { f: `SUM(L2:L${last})` }]);
    const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true }), rg = XLSX.utils.decode_range(ws["!ref"]);
    for (let R = 1; R <= rg.e.r; R++) { [5, 6, 12].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c && c.t === "d") c.z = "dd.mm.yyyy"; }); [7, 8, 9, 11, 18, 19].forEach(C => { const c = ws[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; }); }
    ws["!cols"] = [12, 26, 30, 14, 14, 12, 12, 12, 12, 12, 8, 13, 15, 18, 18, 12, 30, 12, 13, 13].map(w => ({ wch: w }));
    ws["!autofilter"] = { ref: `A1:T${last}` };
    const cats = [...new Set(rows.map(o => o.category || "Други"))], lr = cats.length + 1;
    const SI = (r, col) => `SUMIFS('Фактури'!$${col}$2:$${col}$${last},'Фактури'!$B$2:$B$${last},A${r})`;
    const aoa2 = [["Вид разход", "Брой", "Платено (EUR)", "Неплатено (EUR)", "Общо (EUR)"]];
    cats.forEach((c, i) => { const r = i + 2; aoa2.push([c, { f: `COUNTIF('Фактури'!$B$2:$B$${last},A${r})` }, { f: SI(r, "S") }, { f: SI(r, "T") }, { f: `C${r}+D${r}` }]); });
    aoa2.push(["Общо", { f: `SUM(B2:B${lr})` }, { f: `SUM(C2:C${lr})` }, { f: `SUM(D2:D${lr})` }, { f: `SUM(E2:E${lr})` }]);
    const MS = (m, col) => ({ f: `SUMIFS('Фактури'!$${col}$2:$${col}$${last},'Фактури'!$R$2:$R$${last},"${m}")` });
    aoa2.push([]); aoa2.push(["Начин на плащане", "", "Платено (EUR)", "Неплатено (EUR)", "Общо (EUR)"]);
    ["Банка", "Кеш"].forEach((m, i) => { const r = lr + 3 + i; aoa2.push([m, "", MS(m, "S"), MS(m, "T"), { f: `C${r}+D${r}` }]); });
    const ws2 = XLSX.utils.aoa_to_sheet(aoa2); for (let R = 1; R <= lr + 4; R++) [2, 3, 4].forEach(C => { const c = ws2[XLSX.utils.encode_cell({ r: R, c: C })]; if (c) c.z = "#,##0.00"; });
    ws2["!cols"] = [30, 8, 15, 16, 14].map(w => ({ wch: w }));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Фактури"); XLSX.utils.book_append_sheet(wb, ws2, "По разходи");
    try { XLSX.writeFile(wb, `Фактури ${todayISO()}.xlsx`); toast("Excel файлът се изтегля"); }
    catch (e) { toast("Браузърът спря изтеглянето. Изтегли от Google Таблицата: Файл → Изтегляне → Excel."); }
  };

  // ---------- start ----------
  if (!TOKEN) { notice("Липсва личният ти линк. Отвори приложението от линка, който ти е изпратил администраторът."); $("#subLine").textContent = ""; }
  else {
    // Показваме последно видяното веднага, а новото се дозарежда отзад
    let c = null; try { c = JSON.parse(localStorage.getItem("fakturi_cache") || "null"); } catch (x) {}
    if (c && c.k === TOKEN && c.d && c.d.me) { apply(c.d); applyRole(); S.shown = true; render(); $("#syncDot").textContent = "Обновявам…"; $("#syncDot").hidden = false; }
    load(true).then(() => { $("#syncDot").textContent = "Записвам…"; setSync(); });
    showOutbox();
  }
  setTimeout(() => { if (!S.me && $("#notice").hidden) notice("Зареждането е бавно. Провери интернета и отвори приложението отново."); }, 25000);
})();
</script>
